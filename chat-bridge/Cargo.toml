[package]
name = "chat-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "The C interface of the chat core for the phone apps: the Kotlin code of both apps calls it"
license.workspace = true
publish = false

[lib]
name = "construct_chat_bridge"
# A static library for the iPhone (Kotlin/Native links it), a shared one for Android (loaded at run
# time). The build script asks for the one a target needs.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
chat-core = { path = "../chat-core" }
connectors = { path = "../connectors" }
serde_json = "1.0.154"

# The workspace forbids unsafe code; a C interface cannot do without it. Every `unsafe` block here
# is at the border and says what it relies on. The other lints are the workspace's.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
