[package]
name = "chat-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "The C interface of the chat core for the phone apps: the Kotlin code of both apps calls it"
license.workspace = true
publish = false

[lib]
name = "construct_chat_bridge"
# A shared library for Android (loaded at run time) and an rlib for the tests. The iPhone's static
# library, which Kotlin/Native links, is asked for by the build script (`cargo rustc --crate-type
# staticlib`), so Android and the desktop workspace never build it.
crate-type = ["cdylib", "rlib"]

[dependencies]
chat-core = { path = "../chat-core" }
connectors = { path = "../connectors" }
hex = "0.4"
phone-pairing = { path = "../phone-pairing" }
reqwest = { version = "0.13", default-features = false }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt"] }
tokio-util = { version = "0.7", default-features = false }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }

# On Android the TLS stack asks the system for certificate checks through the JVM, so the library
# needs the JVM's handle once (see `android_tls`). The versions are the ones already in the lock file.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
rustls-platform-verifier = "0.7"

# The workspace forbids unsafe code and a crate cannot take the workspace table and loosen one lint,
# so the lints are written out here: the workspace's, except `unsafe_code`, which a C interface
# cannot do without. Keep them in step with the workspace's. Every `unsafe` block here is at the
# border and says what it relies on.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
