name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    name: formatters (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  cfs-validate:
    name: cfs validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # cfs is distributed from the studio repo; pin to the version this project
      # tracks in .cf-studio/version.toml (v1.5.9).
      - name: Install cfs (Constructor Studio)
        run: pip install "git+https://github.com/constructorfabric/studio.git@v1.5.9"
      # Validation uses the tracked .cf-studio/config + cfs's own bundled core;
      # the gitignored .core/.gen runtime trees are not required here.
      - name: Validate artifacts + traceability
        run: cfs validate --local-only --verbose

  rust:
    name: agent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # The toolkit's build compiles a .proto file: protoc and the well-known types. The agent's
      # host is unix-only, so Windows does not need them.
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends protobuf-compiler libprotobuf-dev
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      # These start a real PostgreSQL with pgvector; pgvector is built for Linux x86_64 only.
      - name: Test (embedded PostgreSQL)
        if: runner.os == 'Linux'
        run: cargo test --locked -- --ignored
