name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'

jobs:
  pre-commit:
    name: formatters (pre-commit)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  cfs-validate:
    name: cfs validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Check whether the artifact registry is empty
        id: registry
        run: |
          python <<'PY'
          import os
          import tomllib
          from pathlib import Path

          registry = tomllib.loads(Path(".cf-studio/config/artifacts.toml").read_text(encoding="utf-8"))
          systems = registry.get("systems")
          system_metadata = {"name", "slug", "kit"}
          entry_lists = {"artifacts", "codebase", "children"}
          empty = registry.keys() == {"systems"} and isinstance(systems, list) and all(
              isinstance(system, dict)
              and system.keys() == system_metadata | entry_lists
              and all(isinstance(system[key], str) and system[key] for key in system_metadata)
              and all(system[key] == [] for key in entry_lists)
              for system in systems
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"empty={str(empty).lower()}", file=output)
          if empty:
              print("No artifacts or codebases are registered.")
          PY
      - name: Install cfs (Constructor Studio)
        if: steps.registry.outputs.empty != 'true'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('.cf-studio/version.toml', 'rb'))['cfs']['version'])")
          pip install "git+https://github.com/constructorfabric/studio.git@${version}"
      # Validation uses the tracked .cf-studio/config + cfs's own bundled core;
      # the gitignored .core/.gen runtime trees are not required here.
      - name: Validate artifacts + traceability
        if: steps.registry.outputs.empty != 'true'
        run: cfs validate --local-only --verbose

  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install protobuf packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends protobuf-compiler libprotobuf-dev
      # Ubuntu 22.04's protoc requires an experimental flag for proto3 optional fields.
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '25.8'
          repo-token: ${{ github.token }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  app:
    name: App
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint:ts
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit

  agent-binary:
    name: Release agent binary
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install protobuf packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends protobuf-compiler libprotobuf-dev
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: '25.8'
          repo-token: ${{ github.token }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the release agent
        run: cargo build --release --locked -p construct-agent --bin construct-agent
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: construct-agent
          path: target/release/construct-agent
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: Electron end-to-end tests
    runs-on: ubuntu-22.04
    # Bundled PostgreSQL needs glibc 2.36, which Bookworm provides.
    container: node:24.22.3-bookworm@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
    needs: agent-binary
    continue-on-error: true
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: construct-agent
          path: target/release
      - name: Install Electron system dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            libasound2 libgbm1 libgtk-3-0 libnss3 libxss1 xauth xvfb
      - name: Install and package the app
        run: |
          chmod +x ../target/release/construct-agent
          npm ci
          node node_modules/electron/install.js
          npm run package
      - name: Install FFmpeg for Playwright recordings
        run: runuser -u node -- npm exec -- playwright install ffmpeg
      - name: Test the app under a virtual display
        # The Playwright fixtures launch Electron with --no-sandbox.
        # PostgreSQL needs an unprivileged user, and Playwright recreates test-results.
        run: |
          chown node:node .
          runuser -u node -- xvfb-run -a npm exec -- playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: electron-test-results
          path: app/test-results/
          retention-days: 7
