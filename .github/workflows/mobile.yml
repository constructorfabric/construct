name: mobile

# Runs the unsigned checks and builds documented in `mobile/README.md`.
# The iOS archive uses `--archive-only` to skip signing and TestFlight.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'chat-bridge/**'
      - 'chat-core/**'
      - 'connectors/**'
      - 'phone-pairing/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tools/**'
      - 'app/src/en.json'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'chat-bridge/**'
      - 'chat-core/**'
      - 'connectors/**'
      - 'phone-pairing/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tools/**'
      - 'app/src/en.json'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: mobile

jobs:
  android:
    name: shared tests, lint, structure checks, Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      # The Gradle home, keyed by the files that decide which libraries and which Gradle it holds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/gradle/libs.versions.toml', 'mobile/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Choose the folder of the chat core
        working-directory: .
        run: echo "CONSTRUCT_CORE_BUILD_DIR=$RUNNER_TEMP/construct-chat-core" >> "$GITHUB_ENV"
      # The chat core is Rust: scripts/build-core.sh builds it into this folder, and cargo's cache is
      # in it too, so a run with unchanged Rust sources starts from the cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/construct-chat-core
          key: chat-core-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: chat-core-${{ runner.os }}-
      # The runner image has the NDK (ANDROID_NDK_HOME); the Rust targets and cargo-ndk are added.
      - name: Install the Rust targets and cargo-ndk
        working-directory: .
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
      # The Android Gradle plugin downloads the platform and the build tools it needs once the
      # licences are accepted. The runner image does not promise that they are.
      - name: Accept the Android SDK licences
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < <(yes) > /dev/null'
      - name: Tests, ktlint, detekt and the structure checks
        run: ./gradlew check --console=plain
      - name: Build the Android app
        run: ./gradlew :androidApp:assembleDebug --console=plain
      # The emulator tests of the chat core need a running emulator, which this job does not start:
      # they are run by hand (`mobile/README.md`). Compiling them here keeps them from rotting.
      - name: Compile the emulator tests
        run: ./gradlew :androidApp:assembleDebugAndroidTest --console=plain

  ios:
    name: framework link, Simulator build, unsigned archive, SwiftLint
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/gradle/libs.versions.toml', 'mobile/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Choose the folder of the chat core
        working-directory: .
        run: echo "CONSTRUCT_CORE_BUILD_DIR=$RUNNER_TEMP/construct-chat-core" >> "$GITHUB_ENV"
      # The chat core is Rust: scripts/build-core.sh builds it into this folder, and cargo's cache is
      # in it too, so a run with unchanged Rust sources starts from the cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/construct-chat-core
          key: chat-core-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: chat-core-${{ runner.os }}-
      - name: Install the Rust targets
        working-directory: .
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      # The Kotlin/Native toolchain, which the first iPhone link downloads; its version is the Kotlin
      # version in the same file.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('mobile/gradle/libs.versions.toml') }}
      # The newest release Xcode the runner image has (not a beta or a release candidate).
      - name: Select Xcode
        working-directory: .
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -v -i -E 'beta|rc|preview' | sort -V | tail -n 1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install xcodegen and swiftlint
        working-directory: .
        shell: bash
        env:
          XCODEGEN_VERSION: 2.48.0
          XCODEGEN_SHA256: 620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892
          SWIFTLINT_VERSION: 0.65.1
          SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --max-time 120 -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          curl -fsSL --retry 3 --max-time 120 -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          printf '%s  %s\n' "$XCODEGEN_SHA256" xcodegen.zip "$SWIFTLINT_SHA256" swiftlint.zip |
            shasum -a 256 --check
          # Keep XcodeGen's bin and share directories together for its setting presets.
          unzip -q xcodegen.zip
          unzip -q swiftlint.zip -d swiftlint
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version
          "$RUNNER_TEMP/swiftlint/swiftlint" version
          printf '%s\n' "$RUNNER_TEMP/xcodegen/bin" "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: Verify the unsigned device archive
        run: scripts/build-ios.sh --archive-only
      - name: Link the Kotlin framework for the Simulator
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --console=plain
      # The chat core's tests, through the Rust library, in the iPhone Simulator.
      - name: Test the chat core in the Simulator
        run: ./gradlew :core:chat:iosSimulatorArm64Test --console=plain
      - name: Generate the Xcode project
        working-directory: mobile/iosApp
        run: xcodegen generate
      # The first single-screen iPhone of the newest iOS runtime the runner has; the foldable
      # "iPhone Duo" is left out, as `scripts/build-ios.sh` does. The step fails when there is none.
      - name: Build the app for the Simulator
        working-directory: mobile/iosApp
        run: |
          simulator="$(xcrun simctl list devices available --json | python3 -I -c '
          import json, re, sys
          found = []
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              match = re.search(r"SimRuntime\.iOS-([0-9-]+)$", runtime)
              names = [d["name"] for d in devices if d["name"].startswith("iPhone") and "Duo" not in d["name"]]
              if match and names:
                  found.append(([int(n) for n in match.group(1).split("-")], names[0]))
          if found:
              print(max(found)[1])
          ')"
          test -n "$simulator" || { echo "No iPhone simulator is available"; exit 1; }
          echo "Simulator: $simulator"
          xcodebuild -project Construct.xcodeproj -scheme Construct \
            -destination "platform=iOS Simulator,name=$simulator" \
            -derivedDataPath build build
      - name: Structure checks and SwiftLint
        run: ./iosApp/check.sh
