[package]
name = "construct-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Construct agent: a background program that runs next to the Construct Browser app"
publish = false

[lib]
name = "construct_agent"
path = "src/lib.rs"

[[bin]]
name = "construct-agent"
path = "src/main.rs"

[dependencies]
postgresql_embedded = { version = "0.22", features = ["bundled", "tokio"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "process", "time", "sync"] }

[lints]
workspace = true
