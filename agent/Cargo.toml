[package]
name = "construct-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Construct agent: a background program that runs next to the Construct Browser app"
license.workspace = true
publish = false

[lib]
name = "construct_agent"
path = "src/lib.rs"

[[bin]]
name = "construct-agent"
path = "src/main.rs"

[dependencies]
connectors = { path = "../connectors" }
serde = { version = "1.0", features = ["derive"] }
postgresql_embedded = { version = "0.22", features = ["bundled", "tokio"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
url = "2.5.8"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "process", "time", "sync"] }

# The Construct host is unix-only (like the database module), so the other platforms neither build
# the toolkit nor need protoc.
[target.'cfg(unix)'.dependencies]
# One toolkit generation (0.13.x), every crate pinned. Published crates only.
toolkit = { package = "cf-gears-toolkit", version = "=0.13.1", features = ["bootstrap"] }
construct = { package = "cf-gears-construct", version = "=0.1.6" }
graph-storage = { package = "cf-gears-graph-storage", version = "=0.3.2" }
types-registry = { package = "cf-gears-types-registry", version = "=0.6.2" }
authn-resolver = { package = "cf-gears-authn-resolver", version = "=0.3.2" }
authz-resolver = { package = "cf-gears-authz-resolver", version = "=0.4.2" }
static-authn-plugin = { package = "cf-gears-static-authn-plugin", version = "=0.4.1" }
static-authz-plugin = { package = "cf-gears-static-authz-plugin", version = "=0.2.1" }
api-gateway = { package = "cf-gears-api-gateway", version = "=0.7.4" }
toolkit-security = { package = "cf-gears-toolkit-security", version = "=0.13.0" }
toolkit-db = { package = "cf-gears-toolkit-db", version = "=0.17.4" }
oagw-sdk = { package = "cf-gears-oagw-sdk", version = "=0.5.18" }
toolkit-canonical-errors = { package = "cf-gears-toolkit-canonical-errors", version = "=0.10.1" }
# The agent's own SQL (the activity store), over the socket. The version is the one the gear
# crates already build, so there is one copy.
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
figment = "0.10"
tokio-util = "0.7"
futures-util = "0.3"
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
hex = "0.4"
# The readiness probe of the host (plain HTTP) and the model Test call (rustls only, no OpenSSL).
ureq = { version = "3", default-features = false, features = ["rustls"] }

[lints]
workspace = true
