[package]
name = "construct-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Construct agent: a background program that runs next to the Construct Browser app"
license.workspace = true
publish = false

[lib]
name = "construct_agent"
path = "src/lib.rs"

[[bin]]
name = "construct-agent"
path = "src/main.rs"

[dependencies]
connectors = { path = "../connectors" }
chat-core = { path = "../chat-core" }
serde = { version = "1.0", features = ["derive"] }
postgresql_embedded = { version = "0.22", features = ["bundled", "tokio"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
regex = "1.13"
time = { version = "0.3", features = ["formatting", "parsing"] }
url = "2.5.8"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "process", "time", "sync", "net", "io-util"] }

# The Construct host is unix-only (like the database module), so the other platforms neither build
# the toolkit nor need protoc.
[target.'cfg(unix)'.dependencies]
# One toolkit generation (0.14.x), every crate pinned. Published crates only.
toolkit = { package = "cf-gears-toolkit", version = "=0.14.0", features = ["bootstrap"] }
construct = { package = "cf-gears-construct", version = "=0.2.0" }
graph-storage = { package = "cf-gears-graph-storage", version = "=0.4.0" }
types-registry = { package = "cf-gears-types-registry", version = "=0.7.0" }
authn-resolver = { package = "cf-gears-authn-resolver", version = "=0.3.3" }
authz-resolver = { package = "cf-gears-authz-resolver", version = "=0.5.0" }
static-authn-plugin = { package = "cf-gears-static-authn-plugin", version = "=0.4.2" }
static-authz-plugin = { package = "cf-gears-static-authz-plugin", version = "=0.2.2" }
cluster = { package = "cf-gears-cluster", version = "=0.4.5" }
grpc-hub = { package = "cf-gears-grpc-hub", version = "=0.5.3" }
api-gateway = { package = "cf-gears-api-gateway", version = "=0.7.5" }
toolkit-gts = { package = "cf-gears-toolkit-gts", version = "=0.3.0" }
toolkit-security = { package = "cf-gears-toolkit-security", version = "=0.14.0" }
toolkit-db = { package = "cf-gears-toolkit-db", version = "=0.18.0" }
oagw-sdk = { package = "cf-gears-oagw-sdk", version = "=0.6.0" }
toolkit-canonical-errors = { package = "cf-gears-toolkit-canonical-errors", version = "=0.10.2" }
# The agent's own SQL (the activity store), over the socket. The version is the one the gear
# crates already build, so there is one copy.
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
figment = "0.10"
tokio-util = "0.7"
futures-util = "0.3"
# The local time zone for the days of the dashboard tool: `time` refuses to read the local offset in
# a process with several threads, and `chrono` reads it for every date.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
hex = "0.4"
# The dashboard types: `#[gts_type_schema]` generates their schemas from the structs, and a
# document is checked against them. The versions are the ones the Construct gear already uses.
gts = "0.16"
schemars = "1"
jsonschema = { version = "0.60", default-features = false }
# The workspace folder: access confined to one open directory, atomic file replacement, globs.
cap-std = "=4.0.3"
cap-tempfile = "=4.0.3"
globset = "=0.4.21"
# The masks of the session files.
regex = "1"
# Constants of the open flags (no unsafe code).
libc = "0.2"
# The readiness probe of the host (plain HTTP) and the model Test call (rustls only, no OpenSSL).
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The phone endpoint: TLS 1.3 with one self-signed certificate (ring only), and the proofs of the pairing.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
sha2 = "0.11"
hmac = "0.13"

# The signals of a Mac (see `mac_signals`). Safe bindings only: the workspace forbids unsafe code.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEventSource", "CGEventTypes", "libc", "CGSession", "CGDirectDisplay", "CGDisplayConfiguration"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary", "CFString"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSRunLoop", "NSDate", "NSString", "NSObjCRuntime", "NSArray", "NSURL"] }
accessibility = "0.2"
accessibility-sys = "0.2"

[dev-dependencies]
# Zones with a clock change, for the tests of the days.
chrono-tz = "0.10"

[lints]
workspace = true
