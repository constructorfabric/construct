complexity:
  TooManyFunctions:
    # The fake implements an interface; its overrides are not a design choice.
    ignoreOverridden: true
style:
  MagicNumber:
    ignoreNamedArgument: true
    excludes: ['**/commonTest/**', '**/src/test/**', '**/androidHostTest/**', '**/iosTest/**', '**/androidTest/**', '**/FakeConstruct.kt', '**/Colors.kt']
  MaxLineLength:
    maxLineLength: 120
naming:
  FunctionNaming:
    ignoreAnnotated: [Composable]
