org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official

# The Android application id, and whether it is the final one. While it is not, the release script only
# builds, installs on the emulator and takes screenshots; it publishes nothing.
constructApplicationId=cf.construct.mobile
constructApplicationIdIsFinal=false

# The version of the Android app. A new release needs a new name (its tag) and a higher code.
constructVersionName=0.1.0
constructVersionCode=1
