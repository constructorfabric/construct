[workspace]
resolver = "3"
members = ["agent", "chat-bridge", "chat-core", "connectors", "phone-pairing"]

[workspace.package]
license = "Apache-2.0"

# Deny the unwrap and expect shortcuts, forbid unsafe code, and keep clippy's pedantic group clean.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"

# Keep debug builds small. Line tables still give file and line numbers in panics and
# backtraces; dependencies carry no debug info. Full debug info grew one target dir past 15 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
