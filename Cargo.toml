[workspace]
resolver = "3"
members = ["agent", "connectors"]

[workspace.package]
license = "Apache-2.0"

# Deny the unwrap and expect shortcuts, forbid unsafe code, and keep clippy's pedantic group clean.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"

# Temporary: the gear crates with the manage-facts route are not published yet. One revision for
# every gear crate, so no git crate meets a published one of another generation. Remove this block
# when the crates are released.
